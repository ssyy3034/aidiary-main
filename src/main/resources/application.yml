server:
  port: 8080

app:
  cache:
    enabled: ${CACHE_ENABLED:true}

spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ai_diary}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 3000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

resilience4j:
  circuitbreaker:
    instances:
      flaskApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

jwt:
  secret: ${JWT_SECRET:your-default-secure-secret-key-at-least-32-chars-long}
  expiration: 86400000 # 밀리초 단위 (24시간)

logging:
  level:
    root: INFO
    org.aidiary: DEBUG
  file:
    name: /var/log/aidiary/aidiary.log # Docker 환경을 고려한 경로

file:
  upload-dir: /uploads/ # Docker에서 볼륨 경로 매핑 필요

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,https://aidiary.shop}
api:
  flask:
    url: http://face-api:5001
